# Netlify hosts ONLY the frontend. The API and the ~1 GB of model weights run
# on a machine you control, reached over an HTTPS tunnel - see the README
# section "Netlify frontend + backend on your own machine".
#
# Required environment variable, set in the Netlify UI (or by the CLI):
#   VITE_API_BASE = https://<your-tunnel-host>     (no trailing slash, no /api)

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The app is a single-page React router-less shell: every path must serve
# index.html rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints asset filenames, so they can be cached hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
